<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EMC — European Medical Center</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f9f9f9;
            color: #333;
            overflow: hidden;
        }

        .header {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
        }

        .logo {
            width: 180px;
            height: auto;
        }

        .hero {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 70vh;
            padding: 60px 20px;
            position: relative;
        }

        .hero-image {
            width: 100%;
            max-width: 1200px;
            height: auto;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            object-fit: cover;
            opacity: 0.85;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(0, 0, 0, 0.4);
            border-radius: 8px;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            text-align: center;
            color: white;
            padding: 40px;
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            font-size: clamp(2.5rem, 5vw, 4rem);
            margin-bottom: 20px;
            font-weight: 700;
            line-height: 1.2;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.7);
        }

        p {
            font-size: 1.2rem;
            line-height: 1.6;
            margin-bottom: 30px;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.7);
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .logo {
                width: 140px;
            }
            .hero-image {
                max-height: 500px;
            }
            h1 {
                font-size: 2rem;
            }
            p {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- Логотип в верхнем левом углу -->
    <div class="header">
        <img src="emc-logo.png" alt="EMC Logo" class="logo">
    </div>

    <!-- Главный блок с изображением и текстом -->
    <div class="hero">
        <div class="hero-image-container">
            <img src="Doctors.png" alt="Врачи EMC" class="hero-image">
            <div class="overlay"></div>
            <div class="content">
                <h1>Европейский медицинский центр</h1>
                <p>Безупречная вежливость и внимательность персонала, сервис высочайшего уровня</p>
            </div>
        </div>
    </div>

    <!-- Скрипт виджета -->
    <script src="https://admin.chatme.ai/widget/common.js" async data-widget-id="55faa42a325365b3ac92a59a4eff2904"></script>

</body>
</html>
